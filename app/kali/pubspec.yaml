name: kali
description: Jaspr web admin portal (Supabase auth via shared middleware).
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.9

dependencies:
  dio: ^5.9.2
  app_bloc:
    path: ../../packages/app_bloc
  client_models:
    path: ../../packages/client_models
  client_supabase:
    path: ../../packages/client_supabase
  http: ^1.2.0
  jaspr: ^0.22.4
  jaspr_router: ^0.8.1
  middleware:
    path: ../../packages/middleware
  supabase: 2.10.4
  web: '>=0.5.0 <2.0.0'

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.6.0
  jaspr_builder: ^0.22.4
  jaspr_cli: ^0.22.4
  lints: ^5.0.0

jaspr:
  mode: client
